[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-matching-algorithm"
version = "1.0.0"
description = "Gale-Shapley stable matching implementation with validation, stability checking, and a command-line interface."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ezekiel Omoregbe"}
]
keywords = ["gale-shapley", "stable-matching", "algorithms", "data-structures"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
stable-match = "stable_matching.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
